name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "VERSION must match the pushed tag (${GITHUB_REF_NAME})."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Execute tests
        run: php artisan test

      - name: Prepare production dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build cPanel package
        shell: bash
        run: |
          mkdir -p release
          rsync -a ./ release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'auth.json' \
            --exclude 'database/*.sqlite*' \
            --exclude 'node_modules/' \
            --exclude 'release/' \
            --exclude 'storage/app/installed' \
            --exclude 'storage/app/updates/' \
            --exclude 'storage/logs/*.log' \
            --exclude 'tests/' \
            --exclude 'bootstrap/cache/*.php'
          (
            cd release
            zip -qr ../Subdomain-Manager-cPanel.zip .
          )
          sha256sum Subdomain-Manager-cPanel.zip > Subdomain-Manager-cPanel.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Subdomain-Manager-cPanel.zip \
            Subdomain-Manager-cPanel.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Subdomain Manager ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
